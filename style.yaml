# Every size, color and text string for the charts (spec, "Chart design").
# Change the look here; no code changes needed. Sizes are in pixels.

theme: light  # light or dark (colors below)

sizes:
  square:   {width: 1080, height: 1080}
  portrait: {width: 1080, height: 1350}

margins:
  left: 64
  right: 64
  top: 56
  bottom: 44

fonts:
  folder: fonts
  regular: Inter-Regular.ttf
  semibold: Inter-SemiBold.ttf
  bold: Inter-Bold.ttf
  display: InterDisplay-ExtraBold.ttf   # headline
  hero: InterDisplay-Black.ttf          # the big number

text_sizes:
  kicker: 20
  hero: 200
  headline: 46
  subtitle: 22
  axis: 19
  end_label: 30
  callout: 19
  bar_label: 24
  bar_value: 26
  rank: 22
  footer: 15
  branding: 17

themes:
  # One color family (Chorus blue) plus a single accent (magenta), used sparingly.
  light:
    background: "#FAF8F4"   # warm paper white
    header_panel: null
    header_text: "#1F1E1C"
    header_muted: "#6E6A63"
    text: "#1F1E1C"         # Chorus charcoal
    text_muted: "#6E6A63"
    grid: "#E6E1D8"
    kicker_fill: null       # plain kicker with a short accent rule
    kicker_text: "#C2005F"  # deep Chorus magenta
    accent: "#D5006C"
    hero: "#0088B0"
    open_gradient: ["#006F90", "#0A95C0"]   # bottom -> top of the open band
    closed: "#CFE3EA"       # pale tint of Chorus blue
    on_closed: "#1F1E1C"    # text and lines drawn on the closed band
    open_pill: ["#0088B0", "#FFFFFF"]       # [fill, text]
    closed_pill: ["#CFE3EA", "#0B4A63"]
    bar: "#9CCBDC"          # leaderboard bars
    bar_lead: "#0088B0"     # the leading named company
    bar_muted: "#E4E0D8"    # stealth (hatched)
    lead_pill: ["#0088B0", "#FFFFFF"]
    up: "#0B6E8E"
    down: "#6E6A63"
    stripe: ["#0088B0", "#D5006C", "#F2C400"]
  dark:
    background: "#0F2430"   # deep navy
    header_panel: null
    header_text: "#F4F2EE"
    header_muted: "#9FB2BC"
    text: "#F4F2EE"         # Chorus cream
    text_muted: "#9FB2BC"
    grid: "#24414F"
    kicker_fill: null
    kicker_text: "#FF5CA8"  # light magenta for contrast on navy
    accent: "#D5006C"
    hero: "#4CC3EA"
    open_gradient: ["#0A7DA3", "#2FB0DC"]
    closed: "#2A4655"       # muted navy
    on_closed: "#F4F2EE"
    open_pill: ["#2FB0DC", "#0F2430"]
    closed_pill: ["#2A4655", "#F4F2EE"]
    bar: "#2A6680"
    bar_lead: "#4CC3EA"
    bar_muted: "#1D3540"
    lead_pill: ["#4CC3EA", "#0F2430"]
    up: "#4CC3EA"
    down: "#9FB2BC"
    stripe: ["#0088B0", "#D5006C", "#F2C400"]

layout:
  stripe_height: 6
  chart_height: 0.56       # share of the image height for the chart area
  gap_after_subtitle: 40
  end_label_space: 150
  leaderboard_rows: 8

text:
  footer_source: "Source: OpenRouter (openrouter.ai/rankings), as of {as_of}. Top-50 coverage {coverage}%. Shares, not exact token counts."
  footer_stealth: "Excludes stealth models ({stealth}% of tokens in the latest week)."
  branding_name: "Daniel Wipert"
  branding_company: "Chorus AI Systems"
  weights_share:
    kicker: "OPEN VS CLOSED · OPENROUTER"
    hero: "{share}%"
    headline: "of tokens now run on open-weight models"
    subtitle: "Weekly share of tokens, {first} to {last}"
    open: "Open"
    closed: "Closed"
    crossover: "{date}: open passes 50%\nand never looks back"
    peak: "Peak: {share}%"
  company_leaderboard:
    kicker: "WHO'S WINNING · OPENROUTER"
    hero: "{share}%"
    headline: "{company} leads OpenRouter"
    headline_stealth_top: "{company} leads the named labs"
    subtitle: "Share of tokens by company, {week}"
    change_header: "VS 4 WKS AGO"
    stealth_note: "maker not yet revealed"
