# Every size, color and text string for the charts (spec, "Chart design").
# Change the look here; no code changes needed. Sizes are in pixels.

theme: dark   # dark or light (colors below)

sizes:
  square:   {width: 1080, height: 1080}
  portrait: {width: 1080, height: 1350}

margins:
  left: 64
  right: 64
  top: 56
  bottom: 44

fonts:
  folder: fonts
  regular: Inter-Regular.ttf
  semibold: Inter-SemiBold.ttf
  bold: Inter-Bold.ttf
  display: InterDisplay-ExtraBold.ttf   # headline
  hero: InterDisplay-Black.ttf          # the big number

text_sizes:
  kicker: 20
  hero: 200
  headline: 46
  subtitle: 22
  axis: 19
  end_label: 30
  callout: 19
  bar_label: 24
  bar_value: 26
  rank: 22
  footer: 15
  branding: 17

themes:
  dark:
    background: "#1F1E1C"   # Chorus charcoal
    header_panel: null      # color block behind the top section, or null
    header_text: "#F4F2EE"
    header_muted: "#A8A39A"
    text: "#F4F2EE"         # Chorus cream
    text_muted: "#A8A39A"
    grid: "#3A3834"
    kicker_fill: "#D5006C"  # magenta pill
    kicker_text: "#FFFFFF"
    accent: "#D5006C"
    hero: "#33B5DE"
    open: "#0088B0"
    open_gradient: ["#00607E", "#33B5DE"]   # bottom -> top of the open band
    closed: "#F2C400"       # Chorus yellow
    open_pill: ["#0088B0", "#FFFFFF"]       # [fill, text]
    closed_pill: ["#F2C400", "#1F1E1C"]
    bar_gradient: ["#0088B0", "#D5006C"]    # bars: blue -> magenta, left to right
    bar_muted: "#4A4741"
    lead_pill: ["#F2C400", "#1F1E1C"]
    up: "#33B5DE"
    down: "#F0519A"
    stripe: ["#0088B0", "#D5006C", "#F2C400"]
  light:
    background: "#F4F2EE"   # Chorus cream
    header_panel: "#1F1E1C" # charcoal color block behind the top section
    header_text: "#F4F2EE"
    header_muted: "#B9B4AA"
    text: "#1F1E1C"
    text_muted: "#6B675F"
    grid: "#DEDAD2"
    kicker_fill: "#F2C400"
    kicker_text: "#1F1E1C"
    accent: "#D5006C"
    hero: "#F2C400"
    open: "#0088B0"
    open_gradient: ["#006F90", "#2BA9D3"]
    closed: "#DDA600"       # deeper gold: Chorus yellow is too pale on cream
    open_pill: ["#0088B0", "#FFFFFF"]
    closed_pill: ["#DDA600", "#1F1E1C"]
    bar_gradient: ["#0088B0", "#D5006C"]
    bar_muted: "#CFCAC0"
    lead_pill: ["#1F1E1C", "#F2C400"]
    up: "#006F90"
    down: "#B8005D"
    stripe: ["#0088B0", "#D5006C", "#F2C400"]

layout:
  stripe_height: 10
  chart_height: 0.56       # share of the image height for the chart area
  gap_after_subtitle: 40
  end_label_space: 150
  leaderboard_rows: 8

text:
  footer_source: "Source: OpenRouter (openrouter.ai/rankings), as of {as_of}. Top-50 coverage {coverage}%. Shares, not exact token counts."
  footer_stealth: "Excludes stealth models ({stealth}% of tokens in the latest week)."
  branding_name: "Daniel Wipert"
  branding_company: "Chorus AI Systems"
  weights_share:
    kicker: "OPEN VS CLOSED · OPENROUTER"
    hero: "{share}%"
    headline: "of tokens now run on open-weight models"
    subtitle: "Weekly share of tokens, {first} to {last}"
    open: "Open"
    closed: "Closed"
    crossover: "{date}: open passes 50%\nand never looks back"
    peak: "Peak: {share}%"
  company_leaderboard:
    kicker: "WHO'S WINNING · OPENROUTER"
    hero: "{share}%"
    headline: "{company} leads OpenRouter"
    headline_stealth_top: "{company} leads the named labs"
    subtitle: "Share of tokens by company, {week}"
    change_header: "VS 4 WKS AGO"
    stealth_note: "maker not yet revealed"
