# Every size, color and text string for the charts (spec, "Chart design").
# Change the look here; no code changes needed. Sizes are in pixels.
# Look: editorial news-magazine style (white page, pastel cyan vs rose,
# labels on the data, light grey grid, small round markers with text inside).

theme: paper

sizes:
  square:   {width: 1080, height: 1080}
  portrait: {width: 1080, height: 1350}

margins:
  left: 64
  right: 64
  top: 60
  bottom: 44

fonts:
  folder: fonts
  regular: FiraSans-Regular.ttf
  medium: FiraSans-Medium.ttf
  semibold: FiraSans-SemiBold.ttf
  bold: FiraSans-Bold.ttf

text_sizes:
  title: 46
  subtitle: 27
  units: 21
  axis: 21
  label: 27          # labels written on the data
  annotation: 21
  bubble: 19
  bar_label: 25
  bar_value: 23
  footer: 16
  branding: 17

themes:
  paper:
    background: "#FFFFFF"
    text: "#121212"
    text_muted: "#5C5C5C"
    grid: "#D9D9D9"
    reference_line: "#121212"   # dashed 50% line
    accent: "#C2185B"           # deep Chorus magenta: arrows and the crossover marker
    open: "#6FCDE3"             # pastel cyan (open-weight band)
    open_dark: "#0088B0"        # Chorus blue: open labels and markers
    closed: "#F6A6AE"           # pastel rose (closed-weight band)
    closed_dark: "#C2185B"      # deep magenta: closed labels
    bar: "#6FCDE3"
    bar_lead: "#0088B0"
    bar_muted: "#CFCFCF"        # stealth
    up: "#0088B0"
    down: "#C2185B"
    stripe: ["#0088B0", "#D5006C", "#F2C400"]   # Chorus rings in the footer mark

layout:
  title_wrap: 33          # characters per title line
  chart_height: 0.60      # share of the image height for the chart area
  gap_after_subtitle: 34
  leaderboard_rows: 10

text:
  footer_source: "Source: OpenRouter (openrouter.ai/rankings), as of {as_of}. Top-50 coverage {coverage}%. Shares, not exact token counts."
  footer_stealth: "Excludes stealth models ({stealth}% of tokens in the latest week)."
  branding_name: "Daniel Wipert"
  branding_company: "Chorus AI Systems"
  weights_share:
    title: "Open-weight models now carry {share}% of OpenRouter tokens"
    subtitle: "Weekly share of tokens, open v closed weights, {first} to {last}"
    units: "% of tokens"
    open: "Open-weight"
    closed: "Closed-weight"
    crossover_bubble: "{date}"
    crossover_note: "Open-weight models passed half of all tokens in the week of {date}, and have stayed above it since"
  company_leaderboard:
    title: "{company} leads OpenRouter with {share}% of tokens"
    title_stealth_top: "{company} leads the named labs on OpenRouter with {share}% of tokens"
    subtitle: "% of tokens by company, {week}"
    change_header: "vs 4 wks ago"
    stealth_label: "Stealth (maker undisclosed)"
